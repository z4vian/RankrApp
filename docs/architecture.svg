<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1060" viewBox="0 0 1400 1060" role="img" aria-labelledby="title desc"><title id="title">Rankr system architecture</title><desc id="desc">An Expo client calls Supabase Auth, database, storage and Edge Functions. Guest drafts stay on device until authenticated import. GitHub pull request tests gate the main branch which Vercel deploys. Optional encrypted storage is separate from regular content.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#b19afa" stroke-width="1.5"/></marker></defs><rect width="1400" height="1060" fill="#14181c"/><style>text{font-family:Inter,Arial,sans-serif;fill:#f4f4f6}.title{font-size:30px;font-weight:700}.lane{font-size:15px;font-weight:600;fill:#b19afa}.node{font-size:18px;font-weight:600}.small{font-size:14px;fill:#b7bac9}.edge{fill:none;stroke:#b19afa;stroke-width:1.6;marker-end:url(#arrow)}.label{font-size:12px;fill:#b7bac9}</style><text x="40" y="50" class="title">Rankr · system architecture</text><text x="40" y="78" class="small">Code map for study · ordinary data, guest drafts and optional services are distinct</text><text x="40" y="116" class="lane">RELEASE PATH</text><rect x="40" y="135" width="230" height="92" rx="10" fill="#1b2026" stroke="#373d48"/><text x="58" y="166" class="node">Feature branch / PR</text><text x="58" y="193" class="small">Source + reviewed fixes</text><rect x="315" y="135" width="300" height="92" rx="10" fill="#1b2026" stroke="#373d48"/><text x="333" y="166" class="node">GitHub Actions</text><text x="333" y="193" class="small">App / browser tests + SQL tests</text><rect x="660" y="135" width="300" height="92" rx="10" fill="#1b2026" stroke="#373d48"/><text x="678" y="166" class="node">Protected main</text><text x="678" y="193" class="small">Required checks before merge</text><rect x="1005" y="135" width="355" height="92" rx="10" fill="#1b2026" stroke="#373d48"/><text x="1023" y="166" class="node">Vercel web hosting</text><text x="1023" y="193" class="small">Expo export → dist → live website</text><path d="M 270 180 H 310" class="edge"/><path d="M 615 180 H 655" class="edge"/><path d="M 960 180 H 1000" class="edge"/><text x="40" y="281" class="lane">CLIENT · BROWSER / EXPO NATIVE</text><rect x="40" y="302" width="310" height="125" rx="10" fill="#1b2026" stroke="#373d48"/><text x="58" y="333" class="node">Expo Router + screens</text><text x="58" y="360" class="small">app/_layout.tsx: session guard</text><text x="58" y="381" class="small">Landing → guest → auth → app</text><text x="58" y="402" class="small">Lists / search / feed / profile</text><rect x="395" y="302" width="330" height="125" rx="10" fill="#1b2026" stroke="#373d48"/><text x="413" y="333" class="node">Shared UI + feature logic</text><text x="413" y="360" class="small">components/: controls and notices</text><text x="413" y="381" class="small">lib/: queries, social, recommendations</text><text x="413" y="402" class="small">Some screens query DB directly</text><rect x="770" y="302" width="280" height="125" rx="10" fill="#1b2026" stroke="#373d48"/><text x="788" y="333" class="node">Supabase client</text><text x="788" y="360" class="small">Public client credential + user JWT</text><text x="788" y="381" class="small">lib/supabase.ts</text><rect x="1095" y="302" width="265" height="125" rx="10" fill="#1b2026" stroke="#373d48"/><text x="1113" y="333" class="node">Media APIs</text><text x="1113" y="360" class="small">TMDB / RAWG</text><text x="1113" y="381" class="small">iTunes / Google Books</text><path d="M 350 361 H 390" class="edge"/><path d="M 725 361 H 765" class="edge"/><path d="M 725 396 H 750 V 454 H 1227 V 432" class="edge"/><rect x="40" y="464" width="410" height="111" rx="10" fill="#1b2026" stroke="#373d48"/><text x="58" y="495" class="node">Guest draft on device</text><text x="58" y="522" class="small">guestDraft.ts: one list, max 20 items</text><text x="58" y="543" class="small">Web: unencrypted localStorage, 7-day TTL</text><text x="58" y="564" class="small">Native: memory only; no account write</text><path d="M 195 427 V 458" class="edge"/><rect x="500" y="464" width="550" height="111" rx="10" fill="#1b2026" stroke="#373d48"/><text x="518" y="495" class="node">Save after signup / login</text><text x="518" y="522" class="small">save-list.tsx → guestImport.ts → atomic RPC</text><text x="518" y="543" class="small">Confirm private save; retain draft on error</text><text x="518" y="564" class="small">Clear local draft only after server confirmation</text><path d="M 450 516 H 495" class="edge"/><path d="M 910 427 V 458" class="edge"/><text x="40" y="632" class="lane">SUPABASE BACKEND · AUTHORIZATION AT EVERY BOUNDARY</text><rect x="40" y="653" width="250" height="135" rx="10" fill="#1b2026" stroke="#373d48"/><text x="58" y="684" class="node">Auth</text><text x="58" y="711" class="small">Identity + JWT</text><text x="58" y="732" class="small">Legal / tour metadata</text><text x="58" y="753" class="small">Profile setup gate</text><rect x="330" y="653" width="325" height="135" rx="10" fill="#1b2026" stroke="#373d48"/><text x="348" y="684" class="node">PostgreSQL + RPC</text><text x="348" y="711" class="small">Profiles / lists / items / social</text><text x="348" y="732" class="small">RLS: owner and visibility rules</text><text x="348" y="753" class="small">Guest import: list + items + ledger</text><rect x="695" y="653" width="285" height="135" rx="10" fill="#1b2026" stroke="#373d48"/><text x="713" y="684" class="node">Object storage</text><text x="713" y="711" class="small">Private list-item photos</text><text x="713" y="732" class="small">Readiness + upload validation</text><text x="713" y="753" class="small">Short-lived signed access</text><rect x="1020" y="653" width="340" height="135" rx="10" fill="#1b2026" stroke="#373d48"/><text x="1038" y="684" class="node">Deno Edge Functions</text><text x="1038" y="711" class="small">delete-account: storage + Auth cleanup</text><text x="1038" y="732" class="small">secure-content: quota / encryption</text><text x="1038" y="753" class="small">push dispatch: server credential</text><path d="M 785 575 V 612 H 492 V 647" class="edge"/><text x="507" y="610" class="small">authenticated import</text><path d="M 910 575 V 626 H 165 V 647" class="edge"/><text x="933" y="618" class="small">Auth / queries / storage / function calls</text><path d="M 910 575 V 635 H 837 V 647" class="edge"/><path d="M 910 575 V 635 H 1190 V 647" class="edge"/><rect x="330" y="844" width="650" height="117" rx="10" fill="#1b2026" stroke="#373d48"/><text x="348" y="875" class="node">Optional encrypted-content path</text><text x="348" y="902" class="small">secureContent.ts → authenticated function → AES-GCM envelopes</text><text x="348" y="923" class="small">encrypted_content stores ciphertext; server owns keys and decrypts</text><text x="348" y="944" class="small">Not connected to ordinary app writes; existing tables remain unchanged</text><rect x="1020" y="844" width="340" height="117" rx="10" fill="#1b2026" stroke="#373d48"/><text x="1038" y="875" class="node">Expo Push service</text><text x="1038" y="902" class="small">Native notifications</text><text x="1038" y="923" class="small">Dispatch requires server-only secret</text><path d="M 1190 788 V 819 H 655 V 838" class="edge" stroke-dasharray="6 5"/><path d="M 1190 788 V 838" class="edge" stroke-dasharray="6 5"/><text x="40" y="1005" class="small">Solid arrows: implemented source dependencies. Dashed arrows: specialized / optional service paths.</text><text x="40" y="1030" class="small">Database migrations are applied separately. Live RLS, function deployment, secrets and native behavior require operational verification.</text></svg>